# 公開環境のデータベースと写真を、毎日バックアップする（#204。#242 で MySQL から PostgreSQL に変えた）
# 1. Aiven の PostgreSQL を書き出して圧縮し、Cloudflare R2 の非公開のバケットに置く（30日より古いものは R2 の決まりで自動で消す）
# 2. 写真のバケットを、同じバックアップのバケットの photos/ に写す（写す側では消さないので、消した写真も残る）
# 3. 取ったバックアップを、この中の別の PostgreSQL に戻してみて、テーブルと件数を確かめる（戻せなければ失敗にする）
# 失敗すると、GitHub からメールが届く。戻し方は docs/backup.md
# 接続の情報は、リポジトリの Settings → Secrets and variables → Actions にだけ入れる
name: バックアップ

on:
  schedule:
    # 毎日 UTC の 19:07（日本時間の朝 4:07）。ちょうどの時刻は GitHub が混むので 7 分にする
    - cron: '7 19 * * *'
  # Actions の画面から、手で動かすこともできる
  workflow_dispatch:

permissions:
  contents: read

# 2つ同時に動かない
concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # 戻す試しに使う、空の PostgreSQL（開発・テストと同じ 18）
    services:
      restore:
        image: postgres:18
        env:
          POSTGRES_USER: restore
          POSTGRES_PASSWORD: restore
          POSTGRES_DB: restore_check
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U restore -d restore_check"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      # 本番の PostgreSQL への接続。psql・pg_dump は PG で始まる環境変数を読む
      PGHOST: ${{ secrets.BACKUP_DB_HOST }}
      PGPORT: ${{ secrets.BACKUP_DB_PORT }}
      PGUSER: ${{ secrets.BACKUP_DB_USERNAME }}
      PGDATABASE: ${{ secrets.BACKUP_DB_DATABASE }}
      # パスワードは PGPASSWORD で渡す（コマンドの文字に入れると、ほかから見えることがあるため）
      PGPASSWORD: ${{ secrets.BACKUP_DB_PASSWORD }}
      # 暗号化した接続で、相手の証明書も確かめる（証明書のファイルは最初の手順で作る）
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /work/ca.pem
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # R2 は新しい aws コマンドの自動の確かめ（チェックサム）に対応していないので、必要なときだけにする
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_ENDPOINT: ${{ secrets.BACKUP_R2_ENDPOINT }}
      PHOTOS_BUCKET: ${{ secrets.BACKUP_R2_PHOTOS_BUCKET }}
      BACKUP_BUCKET: ${{ secrets.BACKUP_R2_BACKUP_BUCKET }}

    steps:
      - name: Aiven の証明書をファイルにする
        env:
          DB_CA: ${{ secrets.BACKUP_DB_CA }}
        run: |
          mkdir -p work
          printf '%s\n' "$DB_CA" > work/ca.pem
          echo "STAMP=$(TZ=Asia/Tokyo date +%Y-%m-%d_%H%M)" >> "$GITHUB_ENV"

      # pg_dump は、本番の PostgreSQL と同じかそれより新しい版でないと書き出せない。18 の箱を使う
      # --no-owner --no-privileges：Aiven の持ち主や権限の命令を入れない（ほかの PostgreSQL にも戻せるように）
      - name: データベースを書き出す
        run: |
          docker run --rm --network host -e PGHOST -e PGPORT -e PGUSER -e PGDATABASE -e PGPASSWORD -e PGSSLMODE -e PGSSLROOTCERT \
            -v "$PWD/work:/work" postgres:18 \
            pg_dump --no-owner --no-privileges > work/db.sql
          gzip -9 work/db.sql
          ls -lh work/db.sql.gz

      - name: 本番の件数を数える（戻したものと比べるため）
        run: |
          docker run --rm --network host -e PGHOST -e PGPORT -e PGUSER -e PGDATABASE -e PGPASSWORD -e PGSSLMODE -e PGSSLROOTCERT \
            -v "$PWD/work:/work" postgres:18 \
            psql -At -F ' ' -v ON_ERROR_STOP=1 \
              -c "SELECT 'users', COUNT(*) FROM users UNION ALL SELECT 'spots', COUNT(*) FROM spots UNION ALL SELECT 'trips', COUNT(*) FROM trips UNION ALL SELECT 'catches', COUNT(*) FROM catches" \
            > work/source-counts.txt
          cat work/source-counts.txt

      # 戻す先は、この中の空の PostgreSQL（暗号化しない、ふつうの接続）
      - name: 戻せるかを試す（空の PostgreSQL に戻して数える）
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5433
          PGUSER: restore
          PGDATABASE: restore_check
          PGPASSWORD: restore
          PGSSLMODE: disable
        run: |
          gunzip -c work/db.sql.gz | docker run --rm -i --network host -e PGHOST -e PGPORT -e PGUSER -e PGDATABASE -e PGPASSWORD -e PGSSLMODE postgres:18 \
            psql -q -v ON_ERROR_STOP=1 > /dev/null
          docker run --rm --network host -e PGHOST -e PGPORT -e PGUSER -e PGDATABASE -e PGPASSWORD -e PGSSLMODE postgres:18 \
            psql -At -F ' ' -v ON_ERROR_STOP=1 \
              -c "SELECT 'users', COUNT(*) FROM users UNION ALL SELECT 'spots', COUNT(*) FROM spots UNION ALL SELECT 'trips', COUNT(*) FROM trips UNION ALL SELECT 'catches', COUNT(*) FROM catches" \
            > work/restored-counts.txt
          docker run --rm --network host -e PGHOST -e PGPORT -e PGUSER -e PGDATABASE -e PGPASSWORD -e PGSSLMODE postgres:18 \
            psql -At -c "SELECT tablename FROM pg_tables WHERE schemaname = 'public'" > work/restored-tables.txt
          cat work/restored-counts.txt
          # アプリのテーブルが全部あること
          for table in users spots trips catches reports notifications password_reset_tokens spot_local_info_changes migrations; do
            grep -qx "$table" work/restored-tables.txt || { echo "::error::戻したデータベースに $table がありません"; exit 1; }
          done
          # 会員と釣り場が1件以上あること（空のバックアップを見逃さない）
          awk '($1=="users" || $1=="spots") && $2 < 1 { print "::error::" $1 " が0件です"; bad=1 } END { exit bad }' work/restored-counts.txt

      - name: データベースのバックアップを R2 に置く
        run: |
          aws s3 cp work/db.sql.gz "s3://$BACKUP_BUCKET/db/fishinglog_$STAMP.sql.gz" --endpoint-url "$R2_ENDPOINT" --no-progress

      # 写す側では消さない（--delete を付けない）ので、間違って消した写真も残る
      - name: 写真を写す
        run: |
          aws s3 sync "s3://$PHOTOS_BUCKET" "s3://$BACKUP_BUCKET/photos" --endpoint-url "$R2_ENDPOINT" --no-progress --only-show-errors
          src=$(aws s3 ls "s3://$PHOTOS_BUCKET" --recursive --endpoint-url "$R2_ENDPOINT" | wc -l)
          dst=$(aws s3 ls "s3://$BACKUP_BUCKET/photos/" --recursive --endpoint-url "$R2_ENDPOINT" | wc -l)
          echo "PHOTOS_SRC=$src" >> "$GITHUB_ENV"
          echo "PHOTOS_DST=$dst" >> "$GITHUB_ENV"
          [ "$dst" -ge "$src" ] || { echo "::error::写真の写しが足りません（元 $src 枚、写し $dst 枚）"; exit 1; }

      - name: 結果を書く
        if: always()
        run: |
          {
            echo "## バックアップの結果（$STAMP）"
            echo ""
            echo "| テーブル | 本番 | 戻したもの |"
            echo "|---|---|---|"
            if [ -f work/source-counts.txt ] && [ -f work/restored-counts.txt ]; then
              paste work/source-counts.txt work/restored-counts.txt | awk '{ print "| " $1 " | " $2 " | " $4 " |" }'
            fi
            echo ""
            # 途中で止まったときもこの手順は失敗にしない（if で書く。[ ] && だと、ないときに失敗の合図になる）
            if [ -f work/db.sql.gz ]; then echo "- データベースのファイル：db/fishinglog_$STAMP.sql.gz（$(du -h work/db.sql.gz | cut -f1)）"; fi
            if [ -n "$PHOTOS_SRC" ]; then echo "- 写真：元 $PHOTOS_SRC 枚、写し $PHOTOS_DST 枚"; fi
          } >> "$GITHUB_STEP_SUMMARY"
